<!DOCTYPE html>
<head>

    <link rel="stylesheet" href="/static/css/style.css">

</head>
<body>
    <div class="hero">
        <h1 id="logo">Macho Star Testing</h1>
        <p class="subtitle">Find your macho rank.</p>
    </div>

    <nav>

        <a class="nav" href="/test">Start Testing</a>
        <a class="nav" href="/admin">Admin Panel</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Set Score</h2>
            <input type="text" placeholder="Username" maxlength="64" id="setscoreusername">
            <input type="number" placeholder="New Score" id="newsetscore">
            <button class="button" id="setscorebutton">Set Score</button>
            <p id="adminmsg"></p>
        </div>
    </div>
    <script src="/static/js/admin.js"></script>
