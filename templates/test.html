<!DOCTYPE html>
<head>
    <title>Macho Star Testing</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/navigation.css">
    <link rel="stylesheet" href="/static/css/buttons.css">
</head>
<body>
    <div class="hero">
        <h1 id="logo">Macho Star Testing</h1>
        <p class="subtitle">Find your macho rank.</p>
    </div>

    <nav>
        <a class="nav" href="/">Home</a>
        <a class="nav" href="/test">Start Testing</a>
        <a class="nav" href="/admin">Admin Panel</a>
    </nav>

    <div class="container">
        <form action="/api/ifinishedtesting">
            <div class="card">
                <h2>Question 1: When was the Macho Website released?</h2>
                <input type="radio" name="q1a1" class="exclusive">
                <label>A. Jan 22</label>
                <input type="radio" name="q1a2" class="exclusive">
                <label>B. Jan 15</label>
                <input type="radio" name="q1a3" class="exclusive">
                <label>C. Jan 10</label>
                <input type="radio" name="q1a4" class="exclusive">
                <label>D. Jan 5</label>
            </div>
            <div class="card">
                <h2>Question 2: Who is the biggest rival of macho?</h2>
                <input type="radio" name="q2a1" class="exclusive">
                <label>A. Dino club</label>
                <input type="radio" name="q2a2" class="exclusive">
                <label>B. Pen club</label>
                <input type="radio" name="q2a3" class="exclusive">
                <label>C. Bear club</label>
                <input type="radio" name="q2a4" class="exclusive">
                <label>D. Fence club</label>
            </div>
        </form>
    </div>
    <script src="/static/js/test.js"></script>
</body>
